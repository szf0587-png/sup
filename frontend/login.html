<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 天眼寻珍·苍穹</title>
    <style>
        :root {
            /* 色彩系统 */
            --primary-500: #22c55e;
            --primary-600: #16a34a;
            --primary-700: #15803d;
            --secondary-500: #3b82f6;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --error-text: #991b1b;

            /* 背景色 */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;

            /* 文字颜色 */
            --text-primary: #f8fafc;
            --text-secondary: #e2e8f0;
            --text-tertiary: #cbd5e1;
            --text-muted: #94a3b8;

            /* 间距 */
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-12: 3rem;

            /* 圆角 */
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;

            /* 阴影 */
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                         0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
                         0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-focus: 0 0 0 3px rgba(34, 197, 94, 0.5);

            /* 动画 */
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%,
                rgba(34, 197, 94, 0.1) 0%,
                transparent 50%),
                radial-gradient(circle at 70% 50%,
                rgba(59, 130, 246, 0.1) 0%,
                transparent 50%);
            animation: bgRotate 30s linear infinite;
        }

        @keyframes bgRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 网格背景 */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* 登录容器 */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: var(--space-6);
        }

        /* 登录卡片 */
        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-xl);
        }

        /* Logo 区域 */
        .logo-section {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-4);
            background: linear-gradient(135deg, var(--primary-500), var(--secondary-500));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
            box-shadow: var(--shadow-lg);
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .logo-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* 表单 */
        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--duration-fast) ease-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: var(--shadow-focus);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* 错误提示 */
        .error-message {
            display: none;
            margin-top: var(--space-2);
            padding: var(--space-3);
            background: var(--error-bg);
            color: var(--error-text);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }

        .error-message.show {
            display: block;
        }

        /* 记住我 */
        .remember-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-6);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: var(--space-2);
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }

        .forgot-link {
            font-size: 0.875rem;
            color: var(--primary-500);
            text-decoration: none;
            transition: color var(--duration-fast) ease-out;
        }

        .forgot-link:hover {
            color: var(--primary-600);
        }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: var(--space-3) var(--space-6);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--duration-fast) ease-out;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary-600);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-700);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 分隔线 */
        .divider {
            display: flex;
            align-items: center;
            margin: var(--space-6) 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider-text {
            padding: 0 var(--space-4);
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* 注册链接 */
        .register-section {
            text-align: center;
            margin-top: var(--space-6);
        }

        .register-text {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }

        .register-link {
            color: var(--primary-500);
            text-decoration: none;
            font-weight: 500;
            margin-left: var(--space-2);
            transition: color var(--duration-fast) ease-out;
        }

        .register-link:hover {
            color: var(--primary-600);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .login-container {
                padding: var(--space-4);
            }

            .login-card {
                padding: var(--space-6);
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="grid-bg"></div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo 区域 -->
            <div class="logo-section">
                <div class="logo">天</div>
                <h1 class="logo-title">天眼寻珍·苍穹</h1>
                <p class="logo-subtitle">GIS 作物适宜性分析平台</p>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="请输入用户名"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="请输入密码"
                        required
                    >
                </div>

                <!-- 错误提示 -->
                <div id="errorMessage" class="error-message"></div>

                <!-- 记住我 -->
                <div class="remember-section">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">记住我</span>
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    登录
                </button>
            </form>

            <!-- 分隔线 -->
            <div class="divider">
                <span class="divider-text">或</span>
            </div>

            <!-- 注册链接 -->
            <div class="register-section">
                <span class="register-text">还没有账号？</span>
                <a href="register.html" class="register-link">立即注册</a>
            </div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script>
        const API_BASE = window.location.origin;
        const nextPath = Navigation.resolveNextPath(new URLSearchParams(window.location.search).get('next'));
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // 隐藏错误信息
        function hideError() {
            errorMessage.classList.remove('show');
        }

        // 登录处理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 显示加载状态
            loginBtn.disabled = true;
            loginBtn.classList.add('btn-loading');
            loginBtn.textContent = '';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功
                    const token = data.access_token;

                    // 保存 token
                    if (remember) {
                        localStorage.setItem('access_token', token);
                    } else {
                        sessionStorage.setItem('access_token', token);
                    }

                    // 跳转到真实控制台，next 只允许内部白名单路径
                    window.location.href = nextPath;
                } else {
                    // 登录失败
                    showError(data.detail || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请检查服务器是否启动');
            } finally {
                // 恢复按钮状态
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading');
                loginBtn.textContent = '登录';
            }
        });

        // 检查是否已登录
        const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
        if (token) {
            // 验证 token 是否有效
            fetch(`${API_BASE}/api/auth/me`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.ok) {
                    // Token 有效，跳转到真实控制台
                    window.location.href = nextPath;
                }
            })
            .catch(error => {
                console.error('Token 验证失败:', error);
            });
        }
    </script>
</body>
</html>
