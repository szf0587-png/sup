<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天眼寻珍·苍穹 — 三维决策视图</title>
<style>
  html, body, #cesiumContainer {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
  }
  #toolbar {
    position: absolute; top: 10px; left: 10px; z-index: 100;
    background: rgba(0,0,0,0.7); color: white; padding: 10px 15px;
    border-radius: 8px; font-family: 'Microsoft YaHei', sans-serif; font-size: 14px;
  }
  #toolbar h3 { margin: 0 0 8px 0; font-size: 16px; color: #4caf50; }
  #toolbar button {
    display: block; margin: 5px 0; padding: 6px 14px;
    background: #2c7a4b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #3d9b5c; }
  #legend {
    position: absolute; bottom: 30px; right: 10px; z-index: 100;
    background: rgba(0,0,0,0.7); color: white; padding: 10px 15px;
    border-radius: 8px; font-family: 'Microsoft YaHei', sans-serif; font-size: 13px;
  }
  .legend-item { margin: 4px 0; }
  .legend-color { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  #statusBar {
    position: absolute; bottom: 10px; left: 10px; z-index: 100;
    background: rgba(0,0,0,0.5); color: #aaa; padding: 4px 10px;
    border-radius: 4px; font-size: 11px; font-family: monospace;
  }
</style>
<!-- Cesium JS -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
<div id="cesiumContainer"></div>

<div id="toolbar">
  <h3>天眼寻珍·苍穹</h3>
  <button onclick="flyToLuonan()">洛南县全景</button>
  <button onclick="flyToTop1()">候选乡镇 #1</button>
  <button onclick="toggleTerrain()">地形 ×2</button>
  <button onclick="toggleResults()">分析结果</button>
  <button onclick="loadDemoData()">加载演示数据</button>
  <p style="font-size:11px;margin:8px 0 0;color:#aaa;">
    地形: Cesium World Terrain<br>
    .sct 地形需在 iDesktopX 生成
  </p>
</div>

<div id="legend" style="display:none;">
  <div class="legend-item"><span class="legend-color" style="background:#4caf50"></span>S级适生区 (≥85)</div>
  <div class="legend-item"><span class="legend-color" style="background:#8bc34a"></span>A级适生区 (75-85)</div>
  <div class="legend-item"><span class="legend-color" style="background:#ff9800"></span>候选设施区</div>
  <div class="legend-item"><span class="legend-color" style="background:#2196f3"></span>乡镇边界</div>
</div>

<div id="statusBar">就绪 | 洛南县 (34.09°N, 110.15°E)</div>

<script>
// ============================================================
// Cesium 初始化
// ============================================================
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS1jMWMxMjRiYzRhNGIiLCJpZCI6MjU5LCJpYXQiOjE2OTUzMjY5Njd9.bIon9HXwBQ_kqYBK3_8KkUT_uYFw0mYDCOkGXfV_qEo';

const viewer = new Cesium.Viewer('cesiumContainer', {
  terrain: Cesium.Terrain.fromWorldTerrain(),
  animation: false,
  timeline: false,
  baseLayerPicker: false,
  fullscreenButton: false,
  homeButton: false,
  sceneModePicker: true,
  navigationHelpButton: false,
  geocoder: false,
  infoBox: false,
  selectionIndicator: false,
});

// 隐藏默认 UI
viewer._cesiumWidget._creditContainer.style.display = 'none';

// 洛南县中心
const LUONAN_CENTER = Cesium.Cartesian3.fromDegrees(110.15, 34.09, 15000);
let terrainExaggeration = 1.0;
let resultsVisible = false;
let demoDataLoaded = false;

// ============================================================
// 飞行动画
// ============================================================
function flyToLuonan() {
  viewer.camera.flyTo({
    destination: LUONAN_CENTER,
    orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-45), roll: 0 },
    duration: 2,
  });
}

function flyToTop1() {
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(110.18, 34.12, 3000),
    orientation: { heading: Cesium.Math.toRadians(30), pitch: Cesium.Math.toRadians(-35), roll: 0 },
    duration: 2,
  });
}

function toggleTerrain() {
  terrainExaggeration = terrainExaggeration === 1.0 ? 2.0 : 1.0;
  viewer.scene.verticalExaggeration = terrainExaggeration;
  document.getElementById('statusBar').textContent =
    `地形夸张: ${terrainExaggeration}x | 洛南县 (34.09°N, 110.15°E)`;
}

// ============================================================
// 分析结果叠加
// ============================================================
let dataSources = [];

async function loadDemoData() {
  if (demoDataLoaded) return;
  demoDataLoaded = true;

  document.getElementById('statusBar').textContent = '加载演示数据中...';
  document.getElementById('legend').style.display = 'block';

  try {
    // 从 FastAPI 获取筛选结果
    const resp = await fetch('http://127.0.0.1:8000/api/golden-standards/list');
    const standards = await resp.json();

    if (standards.length === 0) {
      // 无金标准时加载模拟数据
      loadMock3DData();
      return;
    }

    // 使用第一个金标准启动筛选
    const scrResp = await fetch('http://127.0.0.1:8000/api/screening/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        golden_standard_id: standards[0].id,
        county: '洛南县',
        top_n: 5,
      }),
    });
    const screening = await scrResp.json();
    renderScreening3D(screening);
  } catch (e) {
    console.log('FastAPI 未连接，加载模拟三维数据:', e.message);
    loadMock3DData();
  }
}

function loadMock3DData() {
  // 模拟洛南县乡镇多边形
  const towns = [
    { name: '城关街道', lon: 110.15, lat: 34.09, score: 82.3, color: '#4caf50' },
    { name: '永丰镇', lon: 110.20, lat: 34.12, score: 78.6, color: '#8bc34a' },
    { name: '保安镇', lon: 110.10, lat: 34.06, score: 75.1, color: '#8bc34a' },
    { name: '景村镇', lon: 110.18, lat: 34.04, score: 71.8, color: '#ff9800' },
    { name: '石门镇', lon: 110.22, lat: 34.10, score: 69.4, color: '#ff9800' },
  ];

  const dataSource = new Cesium.CustomDataSource('lunnanDemo');
  towns.forEach((t, i) => {
    // 乡镇标记（柱状体表示评分）
    dataSource.entities.add({
      position: Cesium.Cartesian3.fromDegrees(t.lon, t.lat, t.score * 20),
      cylinder: {
        length: t.score * 20,
        topRadius: 300,
        bottomRadius: 300,
        material: Cesium.Color.fromCssColorString(t.color).withAlpha(0.7),
      },
      label: {
        text: `${t.name}\n${t.score}分`,
        font: '14px Microsoft YaHei',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(0, -20),
      },
    });

    // 乡镇范围椭圆
    dataSource.entities.add({
      position: Cesium.Cartesian3.fromDegrees(t.lon, t.lat),
      ellipse: {
        semiMinorAxis: 1500,
        semiMajorAxis: 2000,
        material: Cesium.Color.fromCssColorString(t.color).withAlpha(0.15),
        outline: true,
        outlineColor: Cesium.Color.fromCssColorString(t.color).withAlpha(0.6),
        outlineWidth: 2,
      },
    });
  });

  viewer.dataSources.add(dataSource);
  dataSources.push(dataSource);
  viewer.flyTo(dataSource);

  document.getElementById('statusBar').textContent =
    '模拟数据已加载 | 洛南县 Top 5 候选乡镇';
}

function renderScreening3D(screening) {
  const dataSource = new Cesium.CustomDataSource('screeningResults');
  const towns = screening.towns || [];

  towns.forEach((t, i) => {
    const color = t.overall_score >= 80 ? '#4caf50'
                : t.overall_score >= 70 ? '#8bc34a'
                : '#ff9800';

    dataSource.entities.add({
      position: Cesium.Cartesian3.fromDegrees(110.15 + i * 0.03, 34.09 + i * 0.01, t.overall_score * 20),
      cylinder: {
        length: t.overall_score * 20,
        topRadius: 300,
        bottomRadius: 300,
        material: Cesium.Color.fromCssColorString(color).withAlpha(0.7),
      },
      label: {
        text: `${t.town_name}\n${t.overall_score}分`,
        font: '14px Microsoft YaHei',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(0, -20),
      },
    });
  });

  viewer.dataSources.add(dataSource);
  dataSources.push(dataSource);
  viewer.flyTo(dataSource);

  document.getElementById('statusBar').textContent =
    `筛选结果已加载 | ${towns.length} 个候选乡镇`;
}

function toggleResults() {
  dataSources.forEach(ds => ds.show = !ds.show);
  resultsVisible = !resultsVisible;
  document.getElementById('legend').style.display = resultsVisible ? 'block' : 'none';
}

// ============================================================
// 初始飞行
// ============================================================
flyToLuonan();
loadDemoData();

// ============================================================
// SuperMap .sct 地形接入（当 iDesktopX 生成后替换）
// ============================================================
// 步骤: iDesktopX → 右键DEM → 生成缓存(.sct) → 发布到 iServer REST-3D
// 然后取消下方注释即可切换为洛南县真实地形

let usingSuperMapTerrain = false;

async function loadSuperMapTerrain() {
  const terrainUrl = 'http://localhost:8090/iserver/services/3D-luonan/rest/realspace/datas/LuonanDEM';
  try {
    const resp = await fetch(terrainUrl, { method: 'HEAD' });
    if (!resp.ok) throw new Error('3D service not ready');
    viewer.terrainProvider = new Cesium.CesiumTerrainProvider({ url: terrainUrl });
    usingSuperMapTerrain = true;
    document.getElementById('statusBar').textContent = 'SuperMap .sct 地形已激活 | 洛南县';
    document.querySelector('#toolbar p').textContent = '地形: SuperMap .sct';
  } catch (e) {
    alert('.sct 地形未就绪。请先在 iDesktopX 中: 右键DEM → 生成缓存(.sct) → 发布到 iServer');
  }
}

// 地形切换按钮（替代原 toggleTerrain）
function toggleTerrain() {
  if (!usingSuperMapTerrain) {
    loadSuperMapTerrain().then(() => {
      if (!usingSuperMapTerrain) {
        terrainExaggeration = terrainExaggeration === 1.0 ? 2.0 : 1.0;
        viewer.scene.verticalExaggeration = terrainExaggeration;
      }
    });
  } else {
    terrainExaggeration = terrainExaggeration === 1.0 ? 2.0 : 1.0;
    viewer.scene.verticalExaggeration = terrainExaggeration;
  }
  document.getElementById('statusBar').textContent =
    `地形夸张: ${terrainExaggeration}x | 洛南县 (34.09°N, 110.15°E)`;
}
</script>
</body>
</html>
