<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 助手</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="ai-chat.css"></head>
<body><main class="chat-app"><aside class="sidebar"><a class="brand" href="index.html"><i class="fa-solid fa-layer-group"></i><span>土地资源评估</span></a><button id="new-chat" class="new-chat" title="新建对话"><i class="fa-solid fa-plus"></i><span>新对话</span></button><div id="conversation-list" class="conversations"></div><nav><a href="index.html"><i class="fa-solid fa-map"></i>工作台</a><a href="data-center.html"><i class="fa-solid fa-database"></i>项目数据</a><a href="map3d.html"><i class="fa-solid fa-cube"></i>三维场景</a></nav></aside>
<section class="chat-shell"><header><div><p>平台智能助手</p><h1 id="conversation-title">新对话</h1></div><button id="settings-button" class="icon" title="AI 设置"><i class="fa-solid fa-gear"></i></button></header><div id="messages" class="messages"><div class="welcome"><i class="fa-solid fa-sparkles"></i><h2>您好，我是平台助手</h2><p>可咨询工作台操作、项目数据管理、iServer 服务和土地资源评估流程。</p></div></div><form id="message-form"><textarea id="message-input" rows="1" maxlength="8000" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea><button class="send" title="发送" aria-label="发送"><i class="fa-solid fa-arrow-up"></i></button></form></section></main>
<dialog id="settings-dialog"><form id="settings-form"><header><div><p>Provider Settings</p><h2>AI 供应商设置</h2></div><button type="button" class="icon" id="close-settings" title="关闭"><i class="fa-solid fa-xmark"></i></button></header><label>供应商标识<input id="provider" value="openai" pattern="[a-z0-9_-]{2,32}" required></label><label>兼容 API 地址<input id="base-url" value="https://api.openai.com/v1" type="url" required></label><label>模型<input id="model" value="gpt-4o-mini" required></label><label>API Key<input id="api-key" type="password" autocomplete="off" minlength="8" required></label><p class="hint">密钥仅以加密形式保存在服务端，不会回显到页面。</p><div class="actions"><button type="button" id="cancel-settings">取消</button><button class="save" type="submit">保存设置</button></div></form></dialog><script src="auth.js"></script><script src="ai-chat.js"></script></body></html>
